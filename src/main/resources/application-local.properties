# Local development profile: enables stronger security headers and CSP for testing
spring.datasource.url=${DB_URL:jdbc:h2:mem:pcm;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:kumar}
spring.datasource.password=${DB_PASSWORD:kumar}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

security.xss.enabled=true
security.xss.add-security-headers=true
security.xss.add-content-security-policy=true
security.xss.content-security-policy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'
ai.service.url=http://localhost:8001
# Allow Swagger and AI endpoints without auth for local testing
springdoc.swagger-ui.enabled=true
spring.security.enabled=false
# For local dev you can override DB (optional) and run with -Dspring.profiles.active=local
# e.g. mvn spring-boot:run -Dspring-boot.run.profiles=local
