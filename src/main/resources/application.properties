spring.application.name=Supply Chain Intelligence Platform
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Disable Spring Batch auto-run on startup
spring.batch.job.enabled=false
server.port=${PORT:8080}
server.servlet.context-path=/supchain

# ==========================================
# Network Configuration for Mobile Access
# ==========================================
# Bind to all network interfaces (0.0.0.0) so app is accessible from mobile devices on LAN
server.address=0.0.0.0
# Enable network access for dashboard (localhost:3000 or network IP)
server.compression.enabled=true

# DATABASE_URL from Railway is postgresql://user:pass@host:port/db
# Convert to JDBC form by replacing the scheme; fall back to local H2 for dev.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:pcm;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:kumar}
spring.datasource.password=${DB_PASSWORD:kumar}

# Driver and dialect auto-selected based on the URL scheme at startup.
# H2 is used when DATABASE_URL is not set (local dev).
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.defer-datasource-initialization=true
logging.level.org.springframework.jdbc.datasource.init=DEBUG


# ==========================================
# JSP View Resolver: Java-based CascadingJspViewResolver
# Resolves views in order:
#   1. /WEB-INF/jsp/{customerCode}/{view}.jsp (customer override)
#   2. /WEB-INF/jsp/{view}.jsp (product default)
# See: com.scplatform.pcm.web.view.CascadingJspViewResolver
# Note: ThymeleafAutoConfiguration is excluded in PcmApplication.java
# ==========================================

# Enable debug logging for view resolution
logging.level.com.scplatform.pcm.web=DEBUG
logging.level.org.springframework.web.servlet.view=DEBUG

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.packages-to-scan=com.scplatform.api

# ==========================================
# XSS Protection Filter Configuration
# ==========================================
# Enable or disable the XSS filter (default: true)
security.xss.enabled=true

# Sanitize HTTP headers (default: true)
security.xss.sanitize-headers=true

# Sanitize cookie values (default: true)
security.xss.sanitize-cookies=true

# Add security headers to responses (default: true)
# Includes: X-XSS-Protection, X-Content-Type-Options, X-Frame-Options
security.xss.add-security-headers=true

# Enable Content-Security-Policy header (default: false)
# Set to true only after configuring the policy for your application
security.xss.add-content-security-policy=false

# Content-Security-Policy value (used only if add-content-security-policy=true)
security.xss.content-security-policy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'

# Log sanitization events (default: true)
security.xss.log-sanitization=true

# URL patterns to exclude from XSS filtering (comma-separated)
# Example: /api/webhook/**,/public/**
#security.xss.excluded-url-patterns=

# Parameter names to exclude from sanitization (comma-separated)
# Example: signature,hash,encoded_data
#security.xss.excluded-parameters=

# Header names to exclude from sanitization (comma-separated)
# Example: Authorization,X-Request-ID
#security.xss.excluded-headers=Authorization

# HTTP methods to exclude from XSS filtering (comma-separated)
# Example: OPTIONS,HEAD
#security.xss.excluded-methods=

# ==========================================
# Unicode/Character Encoding Filter Configuration
# ==========================================
# Enable or disable the Unicode filter (default: true)
security.encoding.enabled=true

# Character encoding to use (default: UTF-8)
security.encoding.charset=UTF-8

# Session handler ignore regex patterns (semicolon-separated)
security.session.handler.ignore-patterns=.*/authenticate;.*/services.*;.*/test;.*/internal/.*;.*/mcm/api/launch_pad/.*;.*/external/.*;.*/e2-modern/.*;.*/js/.*;.*/css/.*;.*/skins/.*;.*/e2redirect.do*;.*/api/.*;.*/swagger-ui.*;.*/v3/api-docs.*;.*/webjars/.*

# Logging for alert system
logging.level.com.scplatform.pcm.alert=DEBUG

mtcm.launchpad.enabled=false

# Hibernate SQL & bind parameter logging
#logging.level.org.hibernate.SQL=DEBUG


# MDC Logging (see logback-spring.xml + MdcLoggingFilter.java)
logging.mdc.enabled=true
logging.mdc.correlation-header=X-Request-ID

# Artemis HA cluster password - override via environment variable ARTEMIS_CLUSTER_PASSWORD
pcm.alert.artemis.ha.cluster-password=${ARTEMIS_CLUSTER_PASSWORD:scplatform-alert-cluster}

# ==========================================
# Mobile API - JWT + Security Configuration
# ==========================================
# IMPORTANT: Always set JWT_SECRET via environment variable in production
# Claude AI (Anthropic) — set ANTHROPIC_API_KEY env variable in production
anthropic.api.key=${ANTHROPIC_API_KEY:}

# NEVER commit a real secret here. Always set JWT_SECRET environment variable in production.
# Local dev default is a 64-char placeholder — strong enough to pass startup validation.
api.jwt.secret=${JWT_SECRET:scip-local-dev-only-replace-with-64char-secret-in-railway!!}
api.jwt.expiration-ms=28800000

# CORS: comma-separated list of allowed origins.
# Defaults cover local dev; Railway and Vercel origins added for production.
api.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084}

# Set to true on Railway to enforce HTTPS via X-Forwarded-Proto redirect
server.railway.https-redirect=${HTTPS_REDIRECT:false}

# Hide Spring Boot version and server info from HTTP responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
spring.mvc.throw-exception-if-no-handler-found=true

# Swagger only accessible in non-production environments
# Set SWAGGER_ENABLED=false in production
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Limit request body size (protect against payload attacks)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=2MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
