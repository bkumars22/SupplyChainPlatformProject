# ── Production Profile — PostgreSQL + Redis ──────────────────

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scip}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scip}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scip_dev_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA — PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis Cache
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis

# Actuator health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8001}

# JWT
jwt.secret=${JWT_SECRET:supplyChainSecretKey2026_ChangeInProd}
jwt.expiration=86400000

# Disable H2
spring.h2.console.enabled=false
