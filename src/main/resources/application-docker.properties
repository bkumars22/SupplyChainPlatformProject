# ==========================================
# Docker / Production Profile
# Activated by: SPRING_PROFILES_ACTIVE=docker
# ==========================================

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scplatform}
spring.datasource.username=${DB_USERNAME:scplatform}
spring.datasource.password=${DB_PASSWORD:sc@Platform2026}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=scplatform-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Disable Swagger in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Production logging
logging.level.root=WARN
logging.level.com.scplatform.pcm=INFO
logging.level.com.scplatform=INFO
