<!DOCTYPE html>
<html lang="en">

<head>
  <title>Rule Builder</title>
  <link rel="stylesheet" href="/css/themes/new/edl.css" data-hook="stylesheet-toggle">
  <link rel="stylesheet" href="/css/examples.css">
</head>

<body>
  <div class="pad-xs-5" id="example-container">
    <div class="container">
      <div class="_df theme-details _dn">
        <div class="_df">
          <h7>Theme:</h7>
          <h6><b><span id="selectedTheme"></span></b></h6>
        </div>
        <div id="figmaLink" class="_dn">
          Figma:<a id="figmaLinkRef" target="_blank">Link</a>
        </div>
        <div class="_df menu-actions theme-details">
          <div class="row flex-items-xs-right margin-bottom-xs-4">
            <span class="eto-dropdown" data-anchor-x="left" data-anchor-y="bottom" id="primary-git-menu">
              <span class="eto-dropdown__toggle">
                <span translate="no" class="notranslate eto-icon md-icon ">info</span>
              </span>
              <ul class="eto-dropdown__menu" id="gitInfoList">
              </ul>
            </span>
          </div>
          <div class="row flex-items-xs-right margin-bottom-xs-4">
            <span class="eto-dropdown" data-anchor-x="left" data-anchor-y="bottom" id="primary-menu">
              <span class="eto-dropdown__toggle">
                <span translate="no" class="notranslate eto-icon md-icon ">settings</span>
              </span>
              <ul class="eto-dropdown__menu">
                <li class="eto-header__user-dropdown__menu-group">
                  <span class="eto-dropdown__menu-item">
                    <h4 class="">Display Density</h4>
                  </span>
                  <div class="eto-dropdown__menu-item">
                    <div class="eto-toggle">
                      <div class="eto-toggle">
                        <div class="eto-toggle__items">
                          <label class="eto-toggle__item" title="Comfortable" onclick="onDensityChnage('comfortable')">
                            <input class="eto-toggle__input" type="radio" name="density-selection" value=""
                              checked="checked">
                            <span class="eto-toggle__label">Comfortable</span>
                          </label>
                          <label class="eto-toggle__item" title="Cozy" onclick="onDensityChnage('cozy')">
                            <input class="eto-toggle__input" type="radio" name="density-selection" value="">
                            <span class="eto-toggle__label">Cozy</span>
                          </label>
                          <label class="eto-toggle__item" title="Compact" onclick="onDensityChnage('compact')">
                            <input class="eto-toggle__input" type="radio" name="density-selection" value="">
                            <span class="eto-toggle__label">Compact</span>
                          </label>
                        </div>
                      </div>
                    </div>
                  </div>
                </li>
                <li class="eto-header__user-dropdown__menu-group">
                  <span class="eto-dropdown__menu-item">
                    <h4 class="">Color Theme</h4>
                  </span>
                  <div class="eto-dropdown__menu-item">
                    <div class="eto-toggle">
                      <div class="eto-toggle">
                        <div class="eto-toggle__items">
                          <label class="eto-toggle__item">
                            <input class="eto-toggle__input" type="radio" name="theme-selection" value="light">
                            <span class="eto-toggle__label">Light</span>
                          </label>
                          <label class="eto-toggle__item">
                            <input class="eto-toggle__input" type="radio" name="theme-selection" value="dark">
                            <span class="eto-toggle__label">Dark</span>
                          </label>
                          <label class="eto-toggle__item" id="modernTheme">
                            <input class="eto-toggle__input" checked="checked" type="radio" name="theme-selection" value="new">
                            <span class="eto-toggle__label">New (β Version)</span>
                          </label>
                          </label>
                        </div>
                      </div>
                    </div>
                  </div>
                </li>
              </ul>
            </span>
          </div>
        </div>
      </div>
      <div>
        <div class="container" id="example-component">
          



  
<div class="eto-rule-builder-well-wrapper">
   <div class="eto-rule-builder-well-container">
      <div class="eto-rule-builder-actions-container">
         <div><h2>Rule</h2></div>
         <div class="eto-rule-builder-actions-wrapper">
            <i translate="no" class="notranslate md-icon">settings</i>
            <i translate="no" class="notranslate md-icon" id="eto-rule-builder-edit">edit</i>
         </div>
      </div>
      <div>
         <div class="eto-rule-builder-loader">
            <svg preserveAspectRatio="xMidYMin meet" viewBox="0 0 150 100" version="1.1"
            xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" >
            <g class="eto-loading" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
               <path class="eto-loading__background" d="M75,0 L150,50 L0,50 L75,0 Z M0,50 L150,50 L75,100 L0,50 Z" fill-opacity="0.5" fill="#FFFFFF"></path>
               <polygon class="eto-loading__top-left" points="75 0 75 50 0 50"></polygon>
               <polygon class="eto-loading__top-right" points="75 0 150 50 75 50"></polygon>
               <polygon class="eto-loading__bottom-right" points="150 50 75 50 75 100"></polygon>
               <polygon class="eto-loading__bottom-left" points="0 50 75 50 75 100"></polygon>
            </g>
            </svg>
         </div>
         <div class="eto-rule-builder">
         </div>
         <div class="eto-rule-builder display-xs-none eto-rule-builder-code-view">
            <div class="eto-rule-builder-well-content">
               <ul class="eto-rule-builder-list eto-rule-top-parent-ul">
                   <li class="eto-rule-builder-list-group nested-group">
                       <div class="eto-rule-builder-list-group-with-conditions">
                           <div class="eto-rule-builder-list-group-with-conditions-children" >
                               <div class="eto-rule-builder-list-group-with-conditions-children-render-rules-indicator">
                                   <div class="rule-indicator-wrapper"><div class="rule-indicator-wrapper-label">CODE</div></div>
                                   <div class="rule-indicator-condition-if rule-indicator-condition-first-if rule-indicator-condition-any-child-level" ><div class="start-bullet"></div></div>
                               </div>
                               <div class="eto-rule-builder-rule-container">
                                   <div class="eto-rule-builder-rule-container-wrapper rule-level-1">
                                       <ul class="eto-rule-builder-list form-rule-drag-list" >
                                           <li class="eto-rule-builder-list-group-row">
                                                <i data-tooltip="#eto-rule-builder-code-validate-tooltip" aria-describedby="#tooltip-example-right" id="eto-rule-builder-code-validate" class="md-icon eto-rule-builder-code-validate"></i>                                                <div contenteditable="true" id="eto-rule-builder-code-view-container" class="eto-rule-builder-code-view-container"></div>
                                                <span class="eto-rule-builder-code-actions">
                                                    <i data-tooltip="#eto-rule-builder-code-publish-tooltip" aria-describedby="#tooltip-example-right" id="eto-rule-builder-code-validate-changes" class="md-icon">published_with_changes</i>
                                                    <i data-tooltip="#eto-rule-builder-code-help-tooltip" aria-describedby="#tooltip-example-right" class="md-icon">help_outline</i>
                                                    <div class="eto-tooltip" data-anchor-x="right" data-anchor-y="bottom" id="eto-rule-builder-code-validate-tooltip">
                                                        <div class="eto-tooltip__content">This rule was valid</div>
                                                        <span class="eto-tooltip__caret"></span>
                                                    </div>
                                                    <div class="eto-tooltip" data-anchor-x="right" data-anchor-y="bottom" id="eto-rule-builder-code-publish-tooltip">
                                                        <div class="eto-tooltip__content">After modify the rules, Please validate your rules from here</div>
                                                        <span class="eto-tooltip__caret"></span>
                                                    </div>
                                                    <div class="eto-tooltip" data-anchor-x="right" data-anchor-y="bottom" id="eto-rule-builder-code-help-tooltip">
                                                        <div class="eto-tooltip__content">This is help</div>
                                                        <span class="eto-tooltip__caret"></span>
                                                    </div>
                                                </span>
                                           </li>
                                       </ul>
                                   </div>
                               </div>
                           </div>
                           <div class="eto-rule-builder-list-group-with-conditions-children lastNode-with-extension">
                               <div class="eto-rule-builder-list-group-with-conditions-children-render-rules-indicator">
                                   <div class="rule-indicator-wrapper"><div class="rule-indicator-wrapper-label"></div></div>
                                   <div class="rule-indicator-condition-empty rule-indicator-condition-firstLevel">
                                       <div class="empty-start-bullet empty-start-bullet-fist-node empty-start-bullet-code-view"><i class="md-icon"></i></div>
                                       <div class="empty-end-bullet eto-rule-builder-toggle-code-view"><i class="md-icon">code</i></div>
                                   </div>
                               </div>
                               <div class="eto-rule-builder-list-group-toggle-expander"></div>
                           </div>
                       </div>
                   </li>
               </ul>
           </div>
         </div>
      </div>
   </div>
   
   <div class="eto-rule-verified-container">
      <div class="eto-rule-verified-container-line">

      </div>
      <div class="eto-rule-verified-container-button">
         <button id="eto-rule-verify-button" class="eto-rule-verify-button">
            <i translate="no" class="notranslate md-icon">done</i>
            Verify
         </button>
      </div>
   </div>
</div>



        </div>
      </div>
    </div>
    </div>
 <script src="/js/babel-polyfill.js"></script>
    <script src="/js/edl.js"></script>
    <script src="/js/examples.js"></script>
    <script>
      if(window.location.href.indexOf('app-header') >= 0 || window.location.href.indexOf('nav-panel') >= 0 ){
       document.getElementById('example-container').classList.add('app-header-example-wrapper');
      }else{
        document.querySelector('._dn').classList.remove('_dn');
      }
      var gitInfo = {};
      var componentsInfo=[];
      try{
          fetch('/js/git.json').then((response) => {
            if (response.ok) {
              return response.json();
            }
            throw new Error('unable to fetch file');
          })
          .then((responseJson) => {
              gitInfo = responseJson
          })
          .catch((error) => {
            console.error(error)
          });

          fetch('/modern_components.json').then((response) => {
            if (response.ok) {
              return response.json();
            }
            throw new Error('unable to fetch file');
          })
          .then((responseJson) => {
            componentsInfo = responseJson;
            const currentComponent = window.location.href.split("/").pop().split('.html').shift();
            let figmaLink = componentsInfo.completed.find(a =>{return a.component === currentComponent})
            if(!figmaLink){
              figmaLink  = componentsInfo.inProgress.find(a =>{return a.component === currentComponent})
            }
            if(figmaLink && figmaLink.figma){
              document.getElementById('figmaLink').classList.remove('_dn');
              document.getElementById('figmaLinkRef').setAttribute('href', figmaLink.figma )
            }
          })
          .catch((error) => {
            console.error(error)
          });
      }catch(e){
        console.error({e})
      }
      updateTheme();
      setTimeout(() => {
        let gitHtml = '';
        Object.entries(gitInfo).map(eachRec => {
          const li = document.createElement('li');
          const label= document.createElement('b');
          label.innerText = `${eachRec[0]}`;

          const value= document.createElement('i');
          value.innerText = `:${eachRec[1]}`;

          li.appendChild(label);
          li.appendChild(value);
          document.getElementById('gitInfoList').appendChild(li);
        });
      }, 1000);
      function updateTheme() {
        const selectedTheme = document.querySelector('input[name="theme-selection"]:checked').value;
        document.getElementById('selectedTheme').textContent  = `${selectedTheme}`;
      }
      document.addEventListener('DOMContentLoaded', function () {
        const styleSheetElem = document.querySelector('[data-hook="stylesheet-toggle"]')
        const themeBtns = document.querySelectorAll(`input[name=theme-selection]`);
        themeBtns && themeBtns.forEach((themeBtn) => {
          themeBtn.addEventListener('click', (e) => {
            let selectedTheme = e.target.value;
            if (selectedTheme === 'light') {
              styleSheetElem.setAttribute('href', '/css/edl.css');
            } else if (selectedTheme === 'new') {
              styleSheetElem.setAttribute('href', '/css/themes/new/edl.css');
            } else {
              styleSheetElem.setAttribute('href', '/css/themes/dark/edl.css');
            }
            document.querySelector("body").setAttribute("data-theme", selectedTheme);
            updateTheme();
          });
        });
        

    new eto.RuleBuilder({
      el: document.querySelector('.eto-rule-builder')
    });

  
      });
      document.querySelector('#primary-menu') && new eto.Dropdown({ el: document.querySelector('#primary-menu') });
      document.querySelector('#primary-git-menu') && new eto.Dropdown({ el: document.querySelector('#primary-git-menu') });

      function onDensityChnage(selectedValue) {
        var gridElements = document.querySelectorAll('.eto-grid');
        const bodyTag = document.querySelector("body");
        bodyTag.click();
        if (selectedValue != 'comfortable') {
          bodyTag.setAttribute("density", selectedValue);
          bodyTag.setAttribute("data-density", selectedValue);
        } else {
          bodyTag.removeAttribute("density");
          bodyTag.removeAttribute("data-density");
        }
        if (gridElements.length) {
          gridElements.forEach(gridElement => {
            var grid = new eto.Grid({
              el: gridElement
            });
            grid.alignRows();
          });
        }
      }
    </script>
    <style>
      ._dn{
        display: none;
      }
      ul#gitInfoList {
        padding: 8px;
      }
      ul#gitInfoList li {
        padding: 4px !important;
      }
      ._df{
        display: flex;
        justify-content: space-between;
      }
      .menu-actions{
        width: 80px;
      }
      .app-header-example-wrapper,
      .app-header-example-wrapper .container
      {
        padding: 0px !important;
      }
      .app-header-example-wrapper .menu-actions .row{
        margin: 0px;
      }
      .app-header-example-wrapper .theme-details{
        display: none;
      }
      .figmaLink{
        display: flex;
        flex-direction: row-reverse;
      }
    </style>
</body>

</html>
