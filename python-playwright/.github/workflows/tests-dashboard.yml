name: Tests and Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        id: run_tests
        run: pytest --html=report.html --self-contained-html --json-report --json-report-file=report.json
        continue-on-error: true

      - name: Generate dashboard
        if: always()
        run: |
          python scripts/generate_dashboard.py report.json dashboard.html \
            "${{ github.server_url }}/${{ github.repository }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Prepare Pages artifact
        if: always()
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp report.html _site/report.html

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site

      - name: Fail the job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
