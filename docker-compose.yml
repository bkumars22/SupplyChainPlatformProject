
services:

  # ── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: scip-postgres
    environment:
      POSTGRES_DB: scip
      POSTGRES_USER: scip
      POSTGRES_PASSWORD: scip_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scip"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: scip-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Java Spring Boot Backend ─────────────────────────────
  backend:
    build:
      context: D:/Projects/mydocs/LearningProject
      dockerfile: Dockerfile
    container_name: scip-backend
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scip
      SPRING_DATASOURCE_USERNAME: scip
      SPRING_DATASOURCE_PASSWORD: scip_dev_2026
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-supplyChainSecretKey2026_ChangeInProd}
      AI_SERVICE_URL: http://ai-service:8001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/supchain/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Python FastAPI AI Service ────────────────────────────
  ai-service:
    build:
      context: D:/Projects/mydocs/LearningProject/ai-service
      dockerfile: Dockerfile
    container_name: scip-ai
    ports:
      - "8001:8001"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BACKEND_URL: http://backend:8089/supchain
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ── React Web App (Nginx) ────────────────────────────────
  web:
    build:
      context: D:/Projects/mydocs/scweb
      dockerfile: Dockerfile
    container_name: scip-web
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      REACT_APP_API_URL: http://localhost:8089/supchain

volumes:
  postgres_data:

networks:
  default:
    name: scip-network
