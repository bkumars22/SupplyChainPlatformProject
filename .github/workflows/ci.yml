name: CI — Build, Test and Verify

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Job 1: Build Java backend ────────────────────────────────────────────────
  build-backend:
    name: Build Java Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build WAR (skip tests)
        run: mvn package -DskipTests -Dmaven.test.skip=true -q

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-war
          path: target/pcm-0.0.1-SNAPSHOT.war
          retention-days: 1

  # ── Job 2: Build Python AI service ──────────────────────────────────────────
  build-ai:
    name: Build & Smoke-test Python AI Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements-ci.txt

      - name: Install dependencies (CI-only, excludes prophet/deepeval)
        working-directory: ai-service
        run: pip install -r requirements-ci.txt

      - name: Start AI service and health check
        working-directory: ai-service
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8001 &
          AI_PID=$!
          echo "uvicorn PID $AI_PID"
          UP=0
          for i in {1..20}; do
            sleep 5
            if curl -sf http://localhost:8001/health; then
              echo "AI service up after $((i*5))s"
              UP=1
              break
            fi
            echo "Waiting ($i/20)..."
            # Exit early if uvicorn process died
            if ! kill -0 $AI_PID 2>/dev/null; then
              echo "uvicorn process died"
              break
            fi
          done
          if [ "$UP" != "1" ]; then
            echo "AI service failed to start — dumping uvicorn log"
            wait $AI_PID || true
            exit 1
          fi
          curl -f http://localhost:8001/health
          curl -f http://localhost:8001/eval/health
          kill $AI_PID 2>/dev/null || true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run Module 1 eval harness (heuristic mode)
        working-directory: ai-service
        run: |
          python - <<'PYEOF'
          import os
          # Suppress deepeval import noise if not installed
          os.environ.setdefault("DEEPEVAL_TELEMETRY_OPT_OUT", "YES")
          from eval.prompt_evaluator import LLMEvaluator
          from eval.test_cases import SUPPLY_CHAIN_TEST_CASES
          ev = LLMEvaluator()
          results = ev.evaluate_batch(SUPPLY_CHAIN_TEST_CASES)
          report = ev.generate_report(results)
          print(f'Eval mode: {report["mode"]}')
          print(f'Cases: {report["total_cases"]}')
          print(f'Avg score: {report["avg_overall_score"]}')
          assert report['pass'], f'Eval harness FAILED: avg score {report["avg_overall_score"]} < 0.7'
          print('PASSED')
          PYEOF

  # ── Job 3: API integration tests (backend running, no frontend needed) ───────
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: backend-war
          path: target/

      - name: Start Spring Boot backend
        run: |
          java -jar target/pcm-0.0.1-SNAPSHOT.war &
          echo "Waiting for backend..."
          for i in {1..24}; do
            curl -sf http://localhost:8089/supchain/api/ai/health && echo "Backend up after $((i*5))s" && break
            sleep 5
          done

      - name: Set up Node 20 (for Playwright API tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install @playwright/test
          npx playwright install --with-deps chromium

      - name: Run API-only tests
        run: npx playwright test test/api.spec.ts --reporter=list
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8089/supchain

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: test-results/
          retention-days: 7

  # ── Job 4: Full E2E tests (backend + frontend) ───────────────────────────────
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: backend-war
          path: target/

      - name: Start Spring Boot backend
        run: |
          java -jar target/pcm-0.0.1-SNAPSHOT.war &
          for i in {1..24}; do
            curl -sf http://localhost:8089/supchain/api/ai/health && echo "Backend up" && break
            sleep 5
          done

      - name: Checkout scweb (React frontend)
        uses: actions/checkout@v4
        with:
          repository: bkumars22/SupplyChainPlatformProject
          path: scweb-checkout
          sparse-checkout: |
            scweb
          sparse-checkout-cone-mode: false
        continue-on-error: true

      - name: Build and serve React app
        run: |
          # Try scweb from sparse checkout, fall back to API-only mode
          if [ -d "scweb-checkout/scweb" ]; then
            cd scweb-checkout/scweb
            npm ci --prefer-offline
            npm run build
            npx serve -s build -l 3000 &
          else
            echo "scweb not available — serving API-only stub on port 3000"
            node -e "
            const http = require('http');
            http.createServer((req,res) => {
              res.writeHead(200, {'Content-Type':'text/html'});
              res.end('<html><body><h1>Supply Chain Intelligence Platform</h1></body></html>');
            }).listen(3000, () => console.log('Stub server on 3000'));
            " &
          fi
          for i in {1..12}; do curl -sf http://localhost:3000 && break || sleep 5; done
        env:
          CI: false

      - name: Install Playwright
        run: |
          npm init -y 2>/dev/null || true
          npm install @playwright/test
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=list,html
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8089/supchain
        continue-on-error: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
