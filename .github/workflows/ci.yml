name: CI — Build, Test and Verify

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    name: Build Java Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build WAR
        run: mvn package -DskipTests -Dmaven.test.skip=true -Dmaven.test.compile.skip=true
      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-war
          path: target/pcm-0.0.1-SNAPSHOT.war
          retention-days: 1

  build-web:
    name: Build React Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: scweb/package-lock.json
      - name: Install and build
        working-directory: scweb
        run: |
          npm ci
          npm run build
        env:
          CI: false

  build-ai:
    name: Build Python AI Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt
      - name: Install and verify
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          uvicorn main:app --host 0.0.0.0 --port 8001 &
          sleep 5
          curl -f http://localhost:8001/health || exit 1
          kill %1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [build-backend, build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: backend-war
          path: target/
      - name: Start backend
        run: |
          java -jar target/pcm-0.0.1-SNAPSHOT.war &
          for i in {1..30}; do curl -sf http://localhost:8089/supchain/actuator/health && break || sleep 5; done
      - name: Start web app
        working-directory: scweb
        run: |
          npm ci
          npm start &
        env:
          CI: false
          BROWSER: none
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Wait for web
        run: for i in {1..20}; do curl -sf http://localhost:3000 && break || sleep 3; done
      - name: Run E2E tests
        run: npx playwright test --reporter=html
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8089/supchain
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    name: Docker Compose Build Test
    runs-on: ubuntu-latest
    needs: [build-backend, build-web, build-ai]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
      - name: Start all services
        run: docker compose up -d
      - name: Wait for backend
        run: for i in {1..30}; do curl -sf http://localhost:8089/supchain/actuator/health && break || sleep 10; done
      - name: Verify all services
        run: |
          curl -f http://localhost:3000 || exit 1
          curl -f http://localhost:8001/health || exit 1
          echo "All services healthy!"
      - name: Tear down
        if: always()
        run: docker compose down -v
