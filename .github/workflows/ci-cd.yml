name: Supply Chain Platform CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ── Job 1: Backend Build & Test ─────────────────────────────────────────────
  backend-ci:
    name: Backend (Java 21 + Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scplatform_test
          POSTGRES_USER: scplatform
          POSTGRES_PASSWORD: sc_test_pass
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: ./mvnw compile -Dmaven.test.skip=true -q

      - name: Run Tests
        run: ./mvnw test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/scplatform_test
          DB_USERNAME: scplatform
          DB_PASSWORD: sc_test_pass

      - name: Build Package
        run: ./mvnw package -Dmaven.test.skip=true -q

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-war
          path: target/*.war
          retention-days: 1

  # ── Job 2: Frontend Build ──────────────────────────────────────────────────
  frontend-ci:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '../scweb/package-lock.json'

      - name: Install dependencies
        working-directory: ../scweb
        run: npm ci

      - name: Build React app
        working-directory: ../scweb
        run: npm run build
        env:
          REACT_APP_API_URL: /supchain

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ../scweb/build
          retention-days: 1

  # ── Job 3: Docker Build & Push ─────────────────────────────────────────────
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-war
          path: target/

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ../scweb
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest

  # ── Job 4: Security Scan ───────────────────────────────────────────────────
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: backend-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'supply-chain-platform'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 9
            --enableRetired

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: reports/
